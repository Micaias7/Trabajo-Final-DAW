
<app-template>
  <p-button
    label="Volver al panel principal"
    icon="pi pi-arrow-left"
    routerLink="/administrador"
    styleClass="p-button-primary"
  />

  <section class="reservar-turno">
    <h2>Reservar turno</h2>

    <p class="descripcion">
      Registrá una nueva reserva para un paciente.
    </p>

    <div class="formulario-contenedor">
      <form (ngSubmit)="reservarTurno()">

        <div class="campo">
          <label for="paciente">Seleccionar paciente:</label>

          <select
            id="paciente"
            name="paciente"
            [(ngModel)]="idPaciente"
          >
            <option [ngValue]="null">Seleccione un paciente</option>

            @for (paciente of pacientes(); track paciente.id) {
              <option [ngValue]="paciente.id">
                {{ paciente.apellidos }}, {{ paciente.nombres }} - DNI:
                {{ paciente.documento }}
              </option>
            }
          </select>
        </div>

        <div class="campo">
          <label for="medico">Seleccionar médico:</label>

          <select
            id="medico"
            name="medico"
            [(ngModel)]="idMedico"
            (ngModelChange)="cargarHorariosOcupados()"
          >
            <option [ngValue]="null">Seleccione un médico</option>

            @for (medico of medicos(); track medico.id) {
              <option [ngValue]="medico.id">
                {{ medico.apellidos }}, {{ medico.nombres }} - Matrícula:
                {{ medico.matricula }}
              </option>
            }
          </select>
        </div>

        <div class="campo">
          <label for="fecha">Fecha del turno:</label>

          <input
            type="date"
            id="fecha"
            name="fecha"
            [(ngModel)]="fecha"
            (ngModelChange)="cargarHorariosOcupados()"
            [min]="fechaMinima"
            [max]="fechaMaxima"
          />
        </div>

        <div class="campo campo-horarios">
          <label>Horario del turno:</label>

          @if (cargandoHorarios()) {
            <p class="mensaje-horarios">
              Consultando horarios disponibles...
            </p>
          }

          @if (errorHorarios()) {
            <p class="mensaje-horarios error">
              No se pudieron consultar los horarios.
            </p>
          }

          <div class="horarios">
            @for (horario of horarios; track horario) {
              <button
                type="button"
                class="horario-btn"
                [class.seleccionado]="hora === horario"
                [disabled]="
                  !idMedico ||
                  !fecha ||
                  cargandoHorarios() ||
                  errorHorarios() ||
                  horarioOcupado(horario) ||
                  horarioPasado(horario)
                "
                (click)="hora = horario"
              >
                {{ horario }}
              </button>
            }
          </div>
        </div>

        <button
          type="submit"
          class="btn-reservar"
          [disabled]="
            !idPaciente ||
            !idMedico ||
            !fecha ||
            !hora ||
            cargandoHorarios() ||
            errorHorarios() ||
            horarioOcupado(hora) ||
            horarioPasado(hora) ||
            guardandoReserva()
          "
        >
          {{ guardandoReserva() ? 'Reservando...' : 'Reservar turno' }}
        </button>

      </form>
    </div>
  </section>
</app-template>
